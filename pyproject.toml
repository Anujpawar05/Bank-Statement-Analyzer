[project]
name = "bank-statement-analyzer"
version = "1.0.0"
description = "Intelligent bank statement analysis, transaction categorization, and Excel generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.0.0",
]

[tool.vercel]
entrypoint = "api.main:app"
